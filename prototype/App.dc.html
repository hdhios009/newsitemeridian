function parseHash() {
  const raw = (location.hash || '#/dashboard').slice(1);
  const [path, ...rest] = raw.split('/').filter(Boolean);
  return { path: path || 'dashboard', args: rest };
}

class Component extends DCLogic {
  state = {
    authView: null,
    route: 'dashboard', routeArgs: [],
    theme: (localStorage.getItem('meridian.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')),
    settingsTab: 'profile',
    // Integrations UI
    integrationsState: loadIntegrationsState(),
    integCat: 'all', integSearch: '',
    integModal: null, integModalStep: 0, integModalData: null, integSaving: false,
    integConfirm: null, // { title, body, danger, onConfirm }
    // Command palette
    cmdOpen: false, cmdQuery: '',
    // Quick-add menu
    quickOpen: false,
    sheet: null, sheetData: null,
    nbStage: 'client',
    nbClient: null, nbDate: 0, nbTime: 18*60, nbDur: 60, nbPrice: 2500, nbService: 'Английский язык', nbMode: 'online', _nbSearch:'',
    nbAdding: false, nbNewName:'', nbNewPhone:'', nbNewEmail:'', nbDupClient: null,
    nbCreatedBooking: null, nbPaymentUrl: null, nbSending: false, nbLinkErr: null,
    nbSendOpen: false, nbMsgDraft: '',
    nbDraftPrompt: false, nbDraft: null, nbStartedAt: 0,
    notifOpen: false, userMenuOpen: false,
    toasts: [],
    clientsFilter: 'all',
    payFilter: 'all',
    bookView: 'week',
    dayOffset: 0,
    calMonth: 7, calYear: 2026, calSelected: 3,
    onbStep: 1,
    passShown: false,
    accordionOpen: 'a1',
    setupDone: {},
  };

  componentDidMount() {
    document.documentElement.setAttribute('data-theme', this.state.theme);
    this._tid = 0;
    this._onHash = () => {
      const { path, args } = parseHash();
      const authRoutes = ['login','register','forgot','onboarding'];
      if (authRoutes.includes(path)) { this.setState({ authView: path }); return; }
      const routes = ['dashboard','bookings','clients','client','payments','settings','notfound'];
      this.setState({ authView: null, route: routes.includes(path) ? path : 'notfound', routeArgs: args });
    };
    window.addEventListener('hashchange', this._onHash);
    if (!location.hash) location.hash = '#/dashboard'; else this._onHash();

    this._kb = (e) => {
      if (e.key === 'Escape') {
        if (this.state.cmdOpen) this.setState({ cmdOpen:false });
        else if (this.state.integModal) this.closeIntegModal();
        else if (this.state.integConfirm) this.setState({ integConfirm:null });
        else if (this.state.sheet) this.closeSheet();
        else this.setState({ notifOpen:false, userMenuOpen:false });
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n' && !this.state.sheet) { e.preventDefault(); this.openNewBooking(); }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); this.setState({ cmdOpen: !this.state.cmdOpen, cmdQuery:'' }); }
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && this.state.sheet === 'new-booking' && this.state.nbStage === 'pay') { e.preventDefault(); this.submitBooking(true); }
    };
    document.addEventListener('keydown', this._kb);
  }
  componentWillUnmount() {
    window.removeEventListener('hashchange', this._onHash);
    document.removeEventListener('keydown', this._kb);
  }

  nav = (path) => { location.hash = '#/' + path; };
  toggleTheme = () => {
    const t = this.state.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('meridian.theme', t);
    document.documentElement.setAttribute('data-theme', t);
    this.setState({ theme: t });
  };
  toast = (msg, kind='info', ic='check') => {
    const id = ++this._tid;
    this.setState({ toasts: [...this.state.toasts, { id, msg, kind, icon: ic }] });
    setTimeout(() => this.setState({ toasts: this.state.toasts.filter(t => t.id !== id) }), 3400);
  };
  closeSheet = () => {
    const s = this.state;
    if (s.sheet === 'new-booking' && ['client','time','pay'].includes(s.nbStage) && this.hasDraftData()) {
      try { localStorage.setItem('meridian.draftBooking', JSON.stringify(this.snapshotDraft())); } catch(_) {}
    }
    this.setState({ sheet:null, sheetData:null, nbSendOpen:false, nbAdding:false, nbDraftPrompt:false });
  };
  hasDraftData = () => { const s = this.state; return !!(s.nbClient || s.nbNewName || s.nbNewPhone); };
  snapshotDraft = () => { const s = this.state; return { nbStage:s.nbStage, nbClient:s.nbClient, nbDate:s.nbDate, nbTime:s.nbTime, nbDur:s.nbDur, nbPrice:s.nbPrice, nbService:s.nbService, nbMode:s.nbMode, t:Date.now() }; };
  clearDraft = () => { try { localStorage.removeItem('meridian.draftBooking'); } catch(_) {} };
  openNewBooking = (prefill={}) => {
    let draft = null;
    try { const raw = localStorage.getItem('meridian.draftBooking'); if (raw) draft = JSON.parse(raw); } catch(_) {}
    if (draft && Date.now() - (draft.t || 0) < 24*60*60*1000 && !prefill.client) {
      this.setState({ sheet:'new-booking', nbDraftPrompt: true, nbDraft: draft,
        nbStage:'client', nbClient:null, nbDate:0, nbTime:18*60, nbDur:60, nbPrice:2500, nbService:'Английский язык', nbMode:'online',
        nbAdding:false, nbNewName:'', nbNewPhone:'', nbNewEmail:'', nbCreatedBooking:null, nbPaymentUrl:null, nbLinkErr:null,
        _nbSearch:'', nbStartedAt: performance.now() });
      return;
    }
    this.setState({ sheet:'new-booking', nbStage:'client',
      nbClient: prefill.client || null, nbDate: 0, nbTime: 18*60, nbDur: 60, nbPrice: 2500, nbService: 'Английский язык', nbMode: 'online', _nbSearch:'',
      nbAdding:false, nbNewName:'', nbNewPhone:'', nbNewEmail:'', nbDupClient:null,
      nbCreatedBooking:null, nbPaymentUrl:null, nbSending:false, nbLinkErr:null,
      nbSendOpen:false, nbMsgDraft:'', nbDraftPrompt:false, nbStartedAt: performance.now() });
  };
  restoreDraft = () => { const d = this.state.nbDraft; if (!d) return; this.setState({ ...d, sheet:'new-booking', nbDraftPrompt:false, nbDraft:null, _nbSearch:'', nbStartedAt: performance.now() }); };
  discardDraft = () => { this.clearDraft(); this.setState({ nbDraftPrompt:false, nbDraft:null }); };
  addClientInline = () => {
    const s = this.state; const name = (s.nbNewName || '').trim(); const phone = (s.nbNewPhone || '').trim();
    if (!name) { this.toast('Введите имя клиента', 'warn', 'info'); return; }
    if (phone.replace(/\D/g,'').length < 10) { this.toast('Проверьте телефон', 'warn', 'info'); return; }
    const dup = CLIENTS.find(c => c.phone.replace(/\D/g,'').slice(-10) === phone.replace(/\D/g,'').slice(-10));
    if (dup) { this.setState({ nbDupClient: dup }); return; }
    const id = 'c_' + Math.random().toString(36).slice(2, 8);
    const newClient = { id, name, phone, channel:'Telegram', note:'', status:'trial', hue: Math.floor(Math.random()*360), plan:'Новый', balance:0, since: fmt.month(new Date().getMonth()) + ' ' + new Date().getFullYear(), service:'—' };
    CLIENTS.push(newClient);
    this.setState({ nbClient: newClient, nbAdding:false, nbStage:'time', nbNewName:'', nbNewPhone:'', nbNewEmail:'', nbDupClient:null });
    this.toast('Клиент добавлен', 'success');
  };
  USER_SERVICES = [
    { name:'Английский язык', dur:60, price:2500, mode:'online' },
    { name:'Английский · подготовка к ОГЭ', dur:60, price:2500, mode:'online' },
    { name:'Business English', dur:60, price:3000, mode:'online' },
    { name:'Разговорная практика', dur:60, price:2500, mode:'online' },
    { name:'Домашние задания и подготовка', dur:45, price:1800, mode:'online' },
  ];
  applyService = (sv) => { this.setState({ nbService: sv.name, nbDur: sv.dur, nbPrice: sv.price, nbMode: sv.mode }); try { localStorage.setItem('meridian.lastService', JSON.stringify(sv)); } catch(_) {} };
  submitBooking = async (withLink=true) => {
    const s = this.state;
    const key = String(s.nbDate);
    const record = { time: s.nbTime, dur: s.nbDur, price: s.nbPrice, paid: withLink ? 'pending' : 'planned', clientId: s.nbClient.id, service: s.nbService, mode: s.nbMode };
    BOOKINGS_BY_DAY[key] = BOOKINGS_BY_DAY[key] || [];
    BOOKINGS_BY_DAY[key].push(record); BOOKINGS_BY_DAY[key].sort((a,b)=>a.time-b.time);
    this.clearDraft();
    try { localStorage.setItem('meridian.firstBooking','1'); } catch(_) {}
    if (!withLink) {
      this.setState({ nbCreatedBooking: { ...record, dayOff: s.nbDate }, nbPaymentUrl: null, nbStage:'done' });
      const el = performance.now() - (s.nbStartedAt || performance.now()); if (el) console.info('[meridian] booking created in ' + Math.round(el) + ' ms (no link)');
      return;
    }
    this.setState({ nbSending: true, nbLinkErr: null });
    try {
      const payment = await paymentService.createPayment({ clientId: s.nbClient.id, amount: s.nbPrice, description: s.nbService + ' · ' + fmt.time(s.nbTime) });
      PAYMENTS.unshift({ id: payment.paymentId, client: s.nbClient.id, amount: s.nbPrice, at:'только что', purpose: s.nbService + ' · ' + this.nbFormattedDate(), status:'pending', method:'ЮKassa' });
      this.setState({ nbSending:false, nbCreatedBooking: { ...record, dayOff: s.nbDate }, nbPaymentUrl: payment.paymentUrl, nbStage:'done', nbMsgDraft: this.buildMessageDraft(s, payment.paymentUrl) });
      const el = performance.now() - (s.nbStartedAt || performance.now()); if (el) console.info('[meridian] booking + link created in ' + Math.round(el) + ' ms');
    } catch (err) {
      this.setState({ nbSending:false, nbCreatedBooking: { ...record, dayOff: s.nbDate }, nbStage:'linkFail', nbLinkErr: err.message || 'Ошибка' });
    }
  };
  retryPaymentLink = async () => {
    const s = this.state; this.setState({ nbSending: true, nbLinkErr: null });
    try {
      const payment = await paymentService.createPayment({ clientId: s.nbClient.id, amount: s.nbPrice, description: s.nbService });
      PAYMENTS.unshift({ id: payment.paymentId, client: s.nbClient.id, amount: s.nbPrice, at:'только что', purpose: s.nbService, status:'pending', method:'ЮKassa' });
      this.setState({ nbSending:false, nbPaymentUrl: payment.paymentUrl, nbStage:'done', nbMsgDraft: this.buildMessageDraft(s, payment.paymentUrl) });
    } catch (err) { this.setState({ nbSending:false, nbLinkErr: err.message || 'Ошибка' }); }
  };

    return H('section', { className:'card', style:{ marginTop:24, overflow:'hidden' } },
      H('div', { style:{ padding:'18px 24px', borderBottom:'1px solid var(--divider)', display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 } },

        H('button', { className:'btn btn-ghost', 'aria-label':'Скрыть блок настройки', onClick:()=>{ localStorage.setItem('meridian.setupHidden','1'); this.forceUpdate(); this.toast('Блок скрыт. Вернуть можно из настроек.'); }, style:{ padding:'6px 10px', fontSize:12.5 } }, 'Скрыть')
      ),

  // Booking row (used across dashboard + bookings)

      onClick:()=>this.openBooking({ ...b, client, dayOff }),
      style:{ display:'grid', gridTemplateColumns:'76px minmax(0,1fr) auto', gap:16, alignItems:'center', padding:'18px 22px', borderBottom: !last ? '1px solid var(--divider)' : 'none', textAlign:'left', width:'100%', opacity: passed ? 0.6 : 1, borderLeft:'3px solid ' + (dayOff === 0 && !passed && b.time < now + 90 ? st.dot : 'transparent'), paddingLeft: 22-3, minHeight:72 } },
      H('div', null,
        H('div', { className:'num', style:{ fontSize:15, fontWeight:600, color:'var(--ink)', letterSpacing:'-0.005em' } }, fmt.time(b.time)),

      ),
      H('div', { style:{ display:'flex', alignItems:'center', gap:14, minWidth:0, overflow:'hidden' } },
        H('div', { className:'avatar', style:{ width:40, height:40, background:`hsl(${client.hue} 60% 55%)`, fontSize:13 } }, client.name.split(' ').map(w=>w[0]).slice(0,2).join('')),
        H('div', { style:{ minWidth:0, flex:1 } },
          H('div', { style:{ display:'flex', gap:10, alignItems:'baseline', overflow:'hidden' } },

        ),
        H('div', { style:{ display:'flex', gap:8, alignItems:'center' } },
          H('div', { style:{ display:'inline-flex', border:'1px solid var(--border)', borderRadius:10, background:'var(--surf)', padding:3 } },

              H('button', { key:v, className:'btn', onClick:()=>this.setState({ bookView: v }),

          ),
          H('button', { className:'btn btn-primary', onClick:()=>this.openNewBooking() },
            icon('plus', { size:16 }), 'Новая запись')

  renderBookingsDay(off) {
    const offsets = [-2,-1,0,1,2,3,4,5];
    const items = BOOKINGS_BY_DAY[String(off)] || [];
    const dayLabel = off === 0 ? 'Сегодня' : off === 1 ? 'Завтра' : off === -1 ? 'Вчера' : (off < 0 ? Math.abs(off) + ' дн. назад' : 'Через ' + off + ' дн.');
    return H('div', null,
      H('div', { style:{ display:'flex', gap:8, marginBottom:20, overflowX:'auto', paddingBottom:2 } },
        offsets.map(o => {
          const active = o === off;
          const d = new Date(); d.setDate(d.getDate() + o);
          const label = o === 0 ? 'Сегодня' : o === 1 ? 'Завтра' : o === -1 ? 'Вчера' : (fmt.dow(d.getDay()).toUpperCase() + ' ' + d.getDate());
          const count = (BOOKINGS_BY_DAY[String(o)] || []).length;
          return H('button', { key:o, className:'btn', onClick:()=>this.setState({ dayOffset: o }),
            style:{ padding:'10px 16px', borderRadius:10, border:'1px solid ' + (active ? 'var(--primary)' : 'var(--border)'), background: active ? 'var(--primarySoft)' : 'var(--surf)', color: active ? 'var(--primaryInk)' : 'var(--text)', fontSize:13.5, fontWeight: active ? 600 : 500, whiteSpace:'nowrap', display:'flex', flexDirection:'column', alignItems:'flex-start', gap:2, minWidth:88 } },
            H('span', null, label),
            H('span', { style:{ fontSize:11, color: active ? 'var(--primary)' : 'var(--dim)', fontWeight:400 } }, count > 0 ? count + ' зап.' : 'свободно'))
        })
      ),
      H('div', { className:'card', style:{ overflow:'hidden' } },
        items.length === 0
          ? H('div', { style:{ padding:'48px 24px', textAlign:'center' } },
              H('div', { style:{ fontSize:15, fontWeight:500, color:'var(--ink)', marginBottom:6 } }, dayLabel + ' — свободно'),

  renderBookingsWeek() {
    const days = [-3,-2,-1,0,1,2,3];
    const startHr = 9;
    const endHr = 20; // inclusive last label
    const rowH = 60; // px per hour
    // Палитра как в макете — цвета сортируются по clientId для стабильности
    // Цвет = смысл: зелёный оплачено, оранжевый ждёт, красный просрочено, серый завершено, синий запланировано
    const STATUS_COLOR = {
      paid:     { bg:'#12B76A' },
      pending:  { bg:'#F79009' },
      overdue:  { bg:'#F04D6E' },
      planned:  { bg:'#2F6BFF' },
      done:     { bg:'#8A94A6' },
      refunded: { bg:'#8A94A6' },
    };
    const colorFor = (b) => STATUS_COLOR[b.paid] || STATUS_COLOR.planned;
    const hours = [];
    for (let hr = startHr; hr <= endHr; hr++) hours.push(hr);
    return H('div', null,
      this.renderStatusLegend(),
      H('div', { className:'card', style:{ overflow:'auto', padding:0 } },
      H('div', { style:{ minWidth:1000 } },
        // Header row (sticky)
        H('div', { style:{ display:'grid', gridTemplateColumns:'80px repeat(7, 1fr)', borderBottom:'1px solid var(--divider)', position:'sticky', top:0, background:'var(--surf)', zIndex:2 } },
          H('div', null),
          days.map((o, i) => {
            const d = new Date(); d.setDate(d.getDate() + o);
            const isToday = o === 0;
            return H('div', { key:i, style:{ padding:'14px 12px', borderLeft:'1px solid var(--divider)', textAlign:'center' } },
              H('div', { style:{ fontSize:11.5, color:'var(--dim)', textTransform:'uppercase', letterSpacing:'0.04em', marginBottom:4, fontWeight:600 } }, fmt.dow(d.getDay())),
              H('div', { className:'num', style:{ fontSize:22, fontWeight:600, color: isToday ? 'var(--primary)' : 'var(--ink)' } }, d.getDate())
            );
          })
        ),
        // Body: relative container with grid rows + absolutely positioned events
        H('div', { style:{ position:'relative', display:'grid', gridTemplateColumns:'80px repeat(7, 1fr)' } },
          // hour labels + empty grid cells for lines
          hours.flatMap(hr => [
            H('div', { key:'h'+hr, className:'num', style:{ height:rowH, padding:'6px 12px', fontSize:12, color:'var(--faint)', textAlign:'right', borderBottom:'1px solid var(--divider)' } }, fmt.time(hr*60)),
            ...days.map((o, i) => H('div', { key:'cell'+hr+'_'+i, style:{ height:rowH, borderLeft:'1px solid var(--divider)', borderBottom:'1px solid var(--divider)' } }))
          ]),
          // Events layer — absolutely positioned over the grid
          H('div', { style:{ position:'absolute', top:0, left:80, right:0, bottom:0, pointerEvents:'none' } },
            days.flatMap((o, colIdx) => {
              const items = (BOOKINGS_BY_DAY[String(o)] || []);
              return items.map((b, j) => {
                const client = CLIENTS.find(c => c.id === b.clientId);
                const startMin = b.time - startHr * 60;
                if (startMin < 0) return null;
                const dur = b.dur;
                const top = (startMin / 60) * rowH + 2;
                const height = Math.max(28, (dur / 60) * rowH - 4);
                const col = colorFor(b);
                const label = client ? client.name : b.service;
                const end = b.time + dur;
                return H('button', { key: o + '_' + j, className:'btn',
                  onClick:()=>this.openBooking({ ...b, client, dayOff: o }),
                  style:{
                    position:'absolute',
                    top: top + 'px', height: height + 'px',
                    left: 'calc(' + (colIdx / 7 * 100) + '% + 4px)',
                    width: 'calc(' + (100/7) + '% - 8px)',
                    background: col.bg, color:'#fff', borderRadius:8,
                    padding:'8px 10px', textAlign:'left', display:'flex', flexDirection:'column', gap:2,
                    boxShadow:'0 1px 2px rgba(0,0,0,.08)', overflow:'hidden',
                    pointerEvents:'auto', cursor:'pointer',
                    transition:'transform 120ms ease, box-shadow 160ms ease, filter 120ms ease',
                  },
                  'style-hover':{ transform:'translateY(-1px)', boxShadow:'0 4px 12px -2px rgba(0,0,0,.18)', filter:'brightness(1.04)' },
                  title: (client ? client.name : '') + ' · ' + b.service + ' · ' + fmt.time(b.time) + '–' + fmt.time(end)
                },
                  H('span', { style:{ fontSize:12.5, fontWeight:600, lineHeight:1.25, overflow:'hidden', display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', wordBreak:'break-word' } }, label),
                  H('span', { className:'num', style:{ fontSize:11, opacity:.9, lineHeight:1.2 } }, fmt.time(b.time) + '–' + fmt.time(end))
                );
              }).filter(Boolean);
            })
          )
        )
      )
      )
    );
  }

  renderBookingsMonth() {
    const s = this.state;
    const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    // Build map for August 2026: day → bookings (using synthetic mapping via offsets from Aug 3)
    const dayFromOffset = (o) => 3 + o;
    const events = {};
    Object.keys(BOOKINGS_BY_DAY).forEach(k => { events[dayFromOffset(parseInt(k))] = BOOKINGS_BY_DAY[k]; });
    const firstDayRaw = new Date(s.calYear, s.calMonth, 1).getDay();
    const firstDay = (firstDayRaw + 6) % 7;
    const daysIn = new Date(s.calYear, s.calMonth + 1, 0).getDate();
    const prevDays = new Date(s.calYear, s.calMonth, 0).getDate();
    const cells = [];
    for (let i=0;i<firstDay;i++) cells.push({ d: prevDays - firstDay + 1 + i, muted:true });
    for (let d=1; d<=daysIn; d++) cells.push({ d, muted:false });
    while (cells.length % 7 !== 0) cells.push({ d: cells.length - firstDay - daysIn + 1, muted:true });
    const selEvents = events[s.calSelected] || [];
    return H('div', { style:{ display:'grid', gridTemplateColumns:'1fr 320px', gap:20 } },
      H('div', { className:'card', style:{ overflow:'hidden' } },
        H('div', { style:{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 18px', borderBottom:'1px solid var(--divider)' } },
          H('div', { style:{ fontSize:15, fontWeight:600, color:'var(--ink)', letterSpacing:'-0.01em' } }, months[s.calMonth] + ' ' + s.calYear),
          H('div', { style:{ display:'flex', gap:4, alignItems:'center' } },
            H('button', { className:'btn', onClick:()=>this.setState({ calMonth: s.calMonth === 0 ? 11 : s.calMonth-1, calYear: s.calMonth === 0 ? s.calYear-1 : s.calYear }), style:{ width:32, height:32, borderRadius:8, color:'var(--muted)', display:'inline-flex', alignItems:'center', justifyContent:'center' }, 'style-hover':{ background:'var(--hover)' } }, icon('chevL', {size:16})),
            H('button', { className:'btn btn-secondary sm', onClick:()=>this.setState({ calMonth:7, calYear:2026, calSelected:3 }) }, 'Сегодня'),
            H('button', { className:'btn', onClick:()=>this.setState({ calMonth: s.calMonth === 11 ? 0 : s.calMonth+1, calYear: s.calMonth === 11 ? s.calYear+1 : s.calYear }), style:{ width:32, height:32, borderRadius:8, color:'var(--muted)', display:'inline-flex', alignItems:'center', justifyContent:'center' }, 'style-hover':{ background:'var(--hover)' } }, icon('chevR', {size:16}))
          )
        ),
        H('div', { style:{ display:'grid', gridTemplateColumns:'repeat(7, 1fr)', background:'var(--surf2)' } },
          ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d, i) => H('div', { key:i, style:{ padding:'10px 12px', fontSize:11, color:'var(--dim)', textTransform:'uppercase', letterSpacing:'0.04em', textAlign:'center', fontWeight:500, borderBottom:'1px solid var(--divider)' } }, d))
        ),
        H('div', { style:{ display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gridAutoRows:'110px' } },
          cells.map((c, i) => {
            const isSel = !c.muted && c.d === s.calSelected;
            const isToday = !c.muted && c.d === 3;
            const evs = c.muted ? [] : (events[c.d] || []);
            return H('button', { key:i, className:'btn',
              onClick:()=>!c.muted && this.setState({ calSelected: c.d }),
              style:{
                borderRight:(i+1) % 7 !== 0 ? '1px solid var(--divider)' : 'none',
                borderBottom: i < cells.length - 7 ? '1px solid var(--divider)' : 'none',
                padding:'8px', textAlign:'left', color: c.muted ? 'var(--faint)' : 'var(--text)',
                background: isSel ? 'var(--primarySoft)' : 'transparent',
                display:'flex', flexDirection:'column', gap:4, overflow:'hidden', position:'relative',
              },
              'style-hover':{ background: c.muted ? 'transparent' : 'var(--hover)' } },
              isSel && H('span', { style:{ position:'absolute', top:0, left:0, right:0, height:2, background:'var(--primary)' } }),
              H('div', { style:{ display:'flex', alignItems:'center', justifyContent:'space-between' } },
                H('span', { className:'num', style:{ fontSize:12.5, fontWeight: isToday || isSel ? 700 : 500, color: isToday ? 'var(--primary)' : (c.muted ? 'var(--faint)' : 'var(--ink)') } }, c.d),
                evs.length > 2 && H('span', { style:{ fontSize:10, color:'var(--faint)', fontWeight:500 } }, '+' + (evs.length-2))
              ),
              evs.slice(0, 2).map((e, j) => {
                const st = STATUS[e.paid];
                const cl = CLIENTS.find(c => c.id === e.clientId);
                return H('div', { key:j, style:{ display:'flex', gap:5, alignItems:'center', fontSize:10.5, color:'var(--text)', overflow:'hidden' } },
                  H('span', { style:{ width:3, height:12, background:st.dot, borderRadius:2, flexShrink:0 } }),
                  H('span', { className:'num', style:{ color:'var(--dim)', fontSize:10 } }, fmt.time(e.time)),
                  H('span', { style:{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', fontWeight:500 } }, cl.name.split(' ')[0])
                );
              })
            );
          })
        )
      ),
      // Side panel
      H('aside', { style:{ position:'sticky', top:80, alignSelf:'flex-start' } },
        H('div', { className:'card', style:{ overflow:'hidden' } },
          H('div', { style:{ padding:'14px 18px', borderBottom:'1px solid var(--divider)' } },
            H('div', { style:{ fontSize:11.5, color:'var(--dim)', textTransform:'uppercase', letterSpacing:'0.04em', fontWeight:500 } }, s.calSelected + ' ' + months[s.calMonth].toLowerCase() + ' ' + s.calYear),
            H('div', { style:{ fontSize:15, fontWeight:600, marginTop:2, color:'var(--ink)' } },
              selEvents.length === 0 ? 'Нет записей' :

          ),
          selEvents.length === 0
            ? H('div', { style:{ padding:24, fontSize:13, color:'var(--dim)', textAlign:'center' } }, 'Свободный день')

                const client = CLIENTS.find(c => c.id === e.clientId);
                const st = STATUS[e.paid];
                return H('button', { key:i, className:'btn row', onClick:()=>this.openBooking({ ...e, client, dayOff: e.time }),
                  style:{ padding:'12px 18px', width:'100%', borderBottom: i < selEvents.length-1 ? '1px solid var(--divider)' : 'none', textAlign:'left', display:'flex', alignItems:'center', gap:10, borderLeft:'3px solid ' + st.dot } },
                  H('div', { className:'num', style:{ fontSize:12, fontWeight:600, color:'var(--ink)', width:44 } }, fmt.time(e.time)),
                  H('div', { style:{ flex:1, minWidth:0 } },
                    H('div', { style:{ fontSize:13, fontWeight:500, color:'var(--ink)' } }, client.name),
                    H('div', { style:{ fontSize:11.5, color:'var(--dim)', marginTop:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, e.service)
                  ),
                  H('div', { className:'num', style:{ fontSize:12, fontWeight:500, color:'var(--muted)' } }, fmt.rub(e.price))
                );
              })
        ),
        H('button', { className:'btn btn-secondary', onClick:()=>this.openNewBooking(), style:{ marginTop:12, width:'100%' } },
          icon('plus', { size:15 }), 'Добавить запись')
      )
    );
  }

  // ─── PAGE: CLIENT DETAIL ─────────────────────
  pClient() {
    const id = this.state.routeArgs[0];
    const c = CLIENTS.find(x => x.id === id) || CLIENTS[0];
    const st = CLIENT_STATUS[c.status];
    const bookings = [];
    Object.keys(BOOKINGS_BY_DAY).forEach(k => {
      BOOKINGS_BY_DAY[k].forEach(b => { if (b.clientId === c.id) bookings.push({ ...b, off: parseInt(k) }); });
    });
    const past = bookings.filter(b => b.off < 0);
    const upcoming = bookings.filter(b => b.off >= 0);
    upcoming.sort((a,b) => a.off - b.off || a.time - b.time);
    past.sort((a,b) => b.off - a.off);
    const totalPaid = PAYMENTS.filter(p => p.client === c.id && p.status === 'paid').reduce((a,p)=>a+p.amount, 0);
    const debt = PAYMENTS.filter(p => p.client === c.id && (p.status==='pending'||p.status==='overdue')).reduce((a,p)=>a+p.amount, 0);

    return H('div', { className:'fade-in', style:{ padding:'32px 40px 60px', maxWidth:1080, margin:'0 auto' } },
      H('button', { className:'btn btn-ghost', onClick:()=>this.nav('clients'), style:{ marginBottom:20, padding:'6px 10px' } },

          H('button', { className:'btn btn-primary', onClick:()=>this.openNewBooking({ client: c }) },

        [
          { l:'Всего оплат', v: fmt.rub(totalPaid), s: PAYMENTS.filter(p=>p.client===c.id&&p.status==='paid').length + ' платежей', dot:'var(--success)' },
          { l:'Задолженность', v: debt > 0 ? fmt.rub(debt) : '—', s: debt > 0 ? 'ждёт клиента' : 'всё оплачено', dot: debt > 0 ? 'var(--warn)' : 'var(--faint)', color: debt > 0 ? 'var(--warnInk)' : 'var(--ink)' },
          { l:'Проведено встреч', v: past.length, s: 'за всё время', dot:'var(--primary)' },
        ].map((s, i) => H('div', { key:i, className:'card', style:{ padding:'18px 20px' } },
          H('div', { style:{ display:'flex', alignItems:'center', gap:8, marginBottom:8 } },

            H('div', { style:{ fontSize:12, color:'var(--dim)', fontWeight:500 } }, s.l)),

          this.field('Максимум вперёд', H('select', { className:'input' }, ['1 неделя','2 недели','1 месяц','3 месяца'].map((v,i)=>H('option',{key:i,selected:i===2},v)))),
          this.field('Буфер между встречами', H('select', { className:'input' }, ['Без буфера','5 мин','10 мин','15 мин','30 мин'].map((v,i)=>H('option',{key:i,selected:i===2},v)))),
        ),
        H('button', { className:'btn btn-primary sm', onClick:()=>this.toast('Настройки страницы сохранены', 'success') }, 'Сохранить настройки')
      ),
      this.setSection('Что разрешено клиенту',
        H('div', { style:{ display:'grid', gap:14 } },
          this.toggleRow('Требовать оплату при бронировании', true),
          this.toggleRow('Требовать подтверждение специалиста', false),
          this.toggleRow('Разрешить перенос', true),
          this.toggleRow('Разрешить отмену', true),
        )
      )
    );
  }

  // ─── Интеграции ───────────────
  setIntegrations() {
    const s = this.state;
    const state = s.integrationsState;
    const q = (s.integSearch || '').toLowerCase();
    const cat = s.integCat;
    const enriched = INTEGRATIONS.map(p => {
      const local = state[p.id];
      const status = p.status === 'coming' ? 'coming' : p.status === 'planned' ? 'planned' : (local && local.status === 'connected' ? 'connected' : 'not_connected');
      return { ...p, runtime: local, statusK: status };
    });
    const filtered = enriched.filter(p => {
      if (cat === 'connected') { if (p.statusK !== 'connected') return false; }
      else if (cat !== 'all' && p.cat !== cat) return false;
      if (q && !(p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.cat.includes(q))) return false;
      return true;
    });
    const connectedList = enriched.filter(p => p.statusK === 'connected');
    const recommended = enriched.filter(p => ['yookassa','telegram','gcal'].includes(p.id) && p.statusK !== 'connected');
    const core = filtered.filter(p => p.pri === 'core');
    const second = filtered.filter(p => p.pri === 'second');
    const later = filtered.filter(p => p.pri === 'later');

    return H('div', null,
      H('div', { style:{ marginBottom:24, paddingBottom:16, borderBottom:'1px solid var(--divider)', display:'flex', justifyContent:'space-between', alignItems:'flex-end', gap:16, flexWrap:'wrap' } },
        H('div', null,
          H('h2', { style:{ margin:0, fontSize:22, fontWeight:700, color:'var(--ink)', letterSpacing:'-0.025em' } }, 'Интеграции'),
          H('p', { style:{ margin:'8px 0 0', fontSize:14.5, color:'var(--muted)' } }, 'Подключите сервисы, которыми уже пользуетесь')
        ),
        connectedList.length > 0 && H('button', { className:'btn btn-secondary sm', onClick: this.testAllIntegrations }, 'Проверить подключения')
      ),

      recommended.length > 0 && cat === 'all' && !q && H('div', { style:{ marginBottom:20 } },
        H('div', { style:{ fontSize:12, fontWeight:600, color:'var(--dim)', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:10 } }, 'Рекомендуем подключить'),
        H('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(260px, 1fr))', gap:12 } },
          recommended.slice(0,3).map(p => this.integCard(p, 'compact'))
        )
      ),

      H('div', { style:{ display:'flex', gap:8, alignItems:'center', marginBottom:16, flexWrap:'wrap' } },
        H('div', { style:{ position:'relative', flex:'1 1 240px', minWidth:200 } },
          H('span', { style:{ position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', color:'var(--dim)' }, dangerouslySetInnerHTML:{ __html: SVG(I.search, {size:15}) } }),
          H('input', { className:'input', placeholder:'Найти интеграцию', value: s.integSearch, onChange:(e)=>this.setState({ integSearch: e.target.value }), style:{ height:38, padding:'0 12px 0 36px', fontSize:13.5 } })
        ),
        H('div', { style:{ display:'flex', gap:4, overflowX:'auto', paddingBottom:2 } },
          INTEG_CATS.map(c => H('button', { key:c.k, className:'btn', onClick:()=>this.setState({ integCat: c.k }),
            style:{ padding:'7px 12px', borderRadius:8, fontSize:13, fontWeight:500, color: cat === c.k ? 'var(--primaryInk)' : 'var(--muted)', background: cat === c.k ? 'var(--primarySoft)' : 'transparent', border:'1px solid ' + (cat === c.k ? 'var(--primaryBorder)' : 'transparent'), whiteSpace:'nowrap' } }, c.l))
        )
      ),

      core.length > 0 && H('div', { style:{ marginBottom:20 } },
        H('div', { style:{ fontSize:12, fontWeight:600, color:'var(--dim)', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:10 } }, 'Основные'),
        H('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(300px, 1fr))', gap:12 } },
          core.map(p => this.integCard(p))
        )
      ),
      second.length > 0 && H('div', { style:{ marginBottom:20 } },
        H('div', { style:{ fontSize:12, fontWeight:600, color:'var(--dim)', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:10 } }, 'Скоро'),
        H('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(300px, 1fr))', gap:12 } },
          second.map(p => this.integCard(p))
        )
      ),
      later.length > 0 && H('div', { style:{ marginBottom:20 } },
        H('div', { style:{ fontSize:12, fontWeight:600, color:'var(--dim)', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:10 } }, 'Дополнительно'),
        H('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(300px, 1fr))', gap:12 } },
          later.map(p => this.integCard(p))
        )
      ),
      (core.length + second.length + later.length) === 0 && H('div', { style:{ padding:'60px 20px', textAlign:'center', color:'var(--dim)' } },
        H('div', { style:{ fontSize:15, fontWeight:600, color:'var(--ink)', marginBottom:6 } }, 'Ничего не нашли'),
        H('div', { style:{ fontSize:13, color:'var(--muted)' } }, 'Попробуйте другой запрос или фильтр')
      )
    );
  }

  integCard(p) {
    const s = this.state;
    const st = p.statusK;
    const local = p.runtime;
    const statusChip = {
      not_connected: { l:'Не подключено', c:'var(--dim)', bg:'var(--surf2)', bd:'var(--border)', dot:'var(--faint)' },
      connecting:    { l:'Подключаем…', c:'var(--primaryInk)', bg:'var(--primarySoft)', bd:'var(--primaryBorder)', dot:'var(--primary)' },
      connected:     { l:'Подключено' + (INTEGRATIONS_DEMO_MODE ? ' · демо' : ''), c:'var(--successInk)', bg:'var(--successSoft)', bd:'var(--successBorder)', dot:'var(--success)' },
      attention:     { l:'Требует внимания', c:'var(--warnInk)', bg:'var(--warnSoft)', bd:'var(--warnBorder)', dot:'var(--warn)' },
      error:         { l:'Ошибка подключения', c:'var(--dangerInk)', bg:'var(--dangerSoft)', bd:'var(--dangerBorder)', dot:'var(--danger)' },
      paused:        { l:'Приостановлено', c:'var(--dim)', bg:'var(--surf2)', bd:'var(--border)', dot:'var(--faint)' },
      coming:        { l:'Скоро', c:'var(--dim)', bg:'var(--surf2)', bd:'var(--border)', dot:'var(--faint)' },
      planned:       { l:'В плане', c:'var(--dim)', bg:'var(--surf2)', bd:'var(--border)', dot:'var(--faint)' },
    }[st];

    let primary;
    if (st === 'connected') primary = H('button', { className:'btn btn-secondary sm', onClick:()=>this.openIntegrationConnect(p.id) }, 'Настроить');
    else if (st === 'coming' || st === 'planned') {
      const subscribed = local && local.subscribed;
      primary = H('button', { className:'btn btn-secondary sm', onClick:()=>this.subscribeIntegration(p.id) }, subscribed ? icon('check', {size:13}) : null, subscribed ? 'Уведомление включено' : 'Уведомить о запуске');
    }
    else primary = H('button', { className:'btn btn-primary sm', onClick:()=>this.openIntegrationConnect(p.id) }, 'Подключить');

    return H('div', { key:p.id, className:'card', style:{ padding:'16px 18px', display:'flex', flexDirection:'column', gap:12, minHeight:150 } },
      H('div', { style:{ display:'flex', alignItems:'center', gap:12 } },
        H('div', { style:{ width:40, height:40, borderRadius:10, background: p.color + '18', color: p.color, display:'inline-flex', alignItems:'center', justifyContent:'center', fontWeight:700, fontSize:16, border:'1px solid ' + p.color + '30' } }, p.letter),
        H('div', { style:{ flex:1, minWidth:0 } },
          H('div', { style:{ fontSize:14.5, fontWeight:600, color:'var(--ink)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, p.name),
          H('div', { className:'chip', style:{ marginTop:5, color: statusChip.c, background: statusChip.bg, borderColor: statusChip.bd, fontSize:11, display:'inline-flex' } },
            H('span', { className:'chip-dot', style:{ background: statusChip.dot } }), statusChip.l)
        )
      ),
      H('div', { style:{ fontSize:13, color:'var(--muted)', lineHeight:1.5, flex:1 } }, p.desc),
      st === 'connected' && local && H('div', { className:'num', style:{ fontSize:11.5, color:'var(--dim)' } }, local.accountLabel),
      H('div', { style:{ display:'flex', gap:6, alignItems:'center' } },
        primary,
        st === 'connected' && H('button', { className:'btn btn-secondary sm', onClick:()=>this.testIntegration(p.id) }, 'Проверить'),
        H('div', { style:{ flex:1 } }),
        st === 'connected' && H('button', { className:'btn', onClick:()=>this.confirmDisconnect(p.id), style:{ width:32, height:32, borderRadius:6, color:'var(--dim)' }, 'style-hover':{ background:'var(--dangerSoft)', color:'var(--danger)' }, 'aria-label':'Отключить' }, icon('more', { size:14 }))
      )
    );
  }

  openIntegrationConnect = (providerId) => {
    this.setState({ integModal: providerId, integModalStep: 0, integModalData: {}, integSaving: false });
  };
  closeIntegModal = () => this.setState({ integModal: null, integModalData: null });

  subscribeIntegration = async (providerId) => {
    const state = { ...this.state.integrationsState };
    const cur = state[providerId] || {};
    const next = { ...cur, subscribed: !cur.subscribed, status: state[providerId] ? state[providerId].status : 'not_connected' };
    state[providerId] = next;
    saveIntegrationsState(state);
    this.setState({ integrationsState: state });
    this.toast(next.subscribed ? 'Сообщим, когда интеграция станет доступна' : 'Уведомление отключено', 'info');
  };

  testIntegration = async (providerId) => {
    const p = INTEGRATIONS.find(x => x.id === providerId);
    this.toast('Проверяем ' + (p ? p.name : ''), 'info', 'clock');
    try { await integrationService.test(providerId); this.toast(p.name + ' работает', 'success'); }
    catch(_) { this.toast('Не удалось проверить ' + p.name, 'error'); }
  };

  testAllIntegrations = async () => {
    this.toast('Проверяем подключения…', 'info', 'clock');
    await new Promise(r => setTimeout(r, 900));
    this.toast('Проверка завершена', 'success');
  };

  confirmDisconnect = (providerId) => {
    const p = INTEGRATIONS.find(x => x.id === providerId);
    this.setState({ integConfirm: {
      title: 'Отключить ' + p.name + '?',
      body: p.id === 'yookassa'
        ? 'Новые платёжные ссылки перестанут создаваться. Уже созданные записи и история оплат сохранятся.'
        : p.id === 'gcal' || p.id === 'ycal'
        ? 'Новые записи перестанут синхронизироваться. Уже созданные события останутся в календаре.'
        : 'Meridian перестанет использовать ' + p.name + '. Данные останутся сохранёнными.',
      danger: true, confirmLabel: 'Отключить',
      onConfirm: async () => {
        await integrationService.disconnect(providerId);
        const state = { ...this.state.integrationsState };
        delete state[providerId];
        saveIntegrationsState(state);
        this.setState({ integrationsState: state, integConfirm: null });
        this.toast(p.name + ' отключена', 'info');
      }
    }});
  };

  finishIntegConnect = async (providerId, extra={}) => {
    this.setState({ integSaving: true });
    try {
      const res = await integrationService.connect(providerId, extra);
      const state = { ...this.state.integrationsState, [providerId]: res };
      saveIntegrationsState(state);
      const p = INTEGRATIONS.find(x => x.id === providerId);
      this.setState({ integrationsState: state, integModal: null, integSaving: false });
      this.toast(p.name + ' подключена', 'success');
    } catch (err) {
      this.setState({ integSaving: false });
      this.toast('Не удалось подключить: ' + (err.message || 'ошибка'), 'error');
    }
  };

  setNotif() {
    return H('div', null,
      this.setHead('Уведомления', 'Как Meridian сообщает о важном'),
      this.setSection('События',
        H('div', { style:{ display:'grid', gap:14 } },
          this.toggleRow('Оплата зачислена', true),
          this.toggleRow('Клиент не оплатил в срок', true),
          this.toggleRow('Клиент подтвердил запись', true),
          this.toggleRow('Клиент отменил запись', true),
          this.toggleRow('Ежедневная сводка утром', false),
        )
      )
    );
  }

  setSecurity() {
    return H('div', null,
      this.setHead('Безопасность', 'Пароль и активные сессии'),
      this.setSection('Пароль',
        H('div', null,
          H('div', { style:{ fontSize:13.5, color:'var(--muted)', marginBottom:16 } }, 'Последнее изменение — 24 марта 2026 г.'),
          H('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12 } },
            this.field('Текущий пароль', this.passField('')),
            this.field('Новый пароль', this.passField('')),
            this.field('Повторите', this.passField('')),
          )
        ),
        H('button', { className:'btn btn-primary sm', onClick:()=>this.toast('Пароль обновлён', 'success') }, 'Обновить пароль')
      )
    );
  }

  toggleRow(label, defOn) {
    return H('label', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:14, cursor:'pointer', padding:'6px 0' } },
      H('span', { style:{ fontSize:14, color:'var(--text)' } }, label),
      H('span', { className: 'toggle ' + (defOn ? 'on' : ''), onClick: (e) => { e.currentTarget.classList.toggle('on'); } })
    );
  }

  // ─── 404 ─────────────────────
  p404() {
    return H('div', { className:'fade-in', style:{ padding:'120px 40px', textAlign:'center', maxWidth:520, margin:'0 auto' } },
      H('div', { className:'num', style:{ fontSize:14, color:'var(--dim)', letterSpacing:'0.1em', marginBottom:12, fontWeight:500 } }, '404'),
      H('h1', { style:{ margin:'0 0 12px', fontSize:28, fontWeight:700, color:'var(--ink)', letterSpacing:'-0.025em' } }, 'Такой страницы нет'),
      H('p', { style:{ margin:'0 0 28px', fontSize:14, color:'var(--muted)', lineHeight:1.6 } }, 'Возможно, ссылка устарела или адрес введён с ошибкой.'),
      H('button', { className:'btn btn-primary', onClick:()=>this.nav('dashboard') }, 'На главную')
    );
  }

  // ─── SHEET ─────────────────────
  renderSheet() {
    const s = this.state;
    let content;
    if (s.sheet === 'new-booking') content = this.renderNewBooking();
    else if (s.sheet === 'booking') content = this.renderBookingDetails();
    else if (s.sheet === 'new-payment') content = this.renderNewPayment();
    else return null;
    return H('div', { onClick: this.closeSheet,
      style:{ position:'fixed', inset:0, background:'rgba(15,23,42,.42)', zIndex:60, display:'flex', justifyContent:'flex-end', backdropFilter:'blur(2px)' }, className:'fade-in' },
      H('div', { className:'sheet-in', onClick:(e)=>e.stopPropagation(),
        style:{ width:540, maxWidth:'100vw', height:'100%', background:'var(--surf)', boxShadow:'var(--shadowLg)', display:'flex', flexDirection:'column' } },
        content
      )
    );
  }

  sheetHead(title, sub) {
    return H('div', { style:{ padding:'22px 26px 16px', borderBottom:'1px solid var(--divider)', display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:16 } },
      H('div', null,
        H('h2', { style:{ margin:0, fontSize:20, fontWeight:700, color:'var(--ink)', letterSpacing:'-0.02em' } }, title),
        sub && H('div', { style:{ fontSize:13, color:'var(--muted)', marginTop:4 } }, sub)
      ),
      H('button', { className:'btn', onClick: this.closeSheet, style:{ width:32, height:32, borderRadius:8, color:'var(--dim)', display:'inline-flex', alignItems:'center', justifyContent:'center' }, 'style-hover':{ background:'var(--hover)', color:'var(--ink)' } },
        icon('x', { size:16 }))
    );
  }

  // ─── Новая запись — три этапа с сохранением черновика ─────
  renderNewBooking() {
    const s = this.state;
    if (s.nbDraftPrompt) {
      return H(React.Fragment, null,
        this.sheetHead('Новая запись'),
        H('div', { style:{ padding:'32px 26px', flex:1, display:'flex', flexDirection:'column', justifyContent:'center' } },
          H('div', { style:{ fontSize:16, fontWeight:600, color:'var(--ink)', marginBottom:8 } }, 'Продолжить незавершённую запись?'),
          H('p', { style:{ margin:'0 0 20px', fontSize:13.5, color:'var(--muted)', lineHeight:1.55 } }, 'Вы недавно начали создавать запись, но не закончили. Данные сохранены на этом устройстве.'),
          H('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 } },
            H('button', { className:'btn btn-secondary', onClick: this.discardDraft }, 'Начать заново'),
            H('button', { className:'btn btn-primary', onClick: this.restoreDraft }, 'Продолжить')
          )
        )
      );
    }
    const stage = s.nbStage;
    const done = { client: !!s.nbClient, time: !!s.nbClient && !!s.nbService && s.nbPrice > 0, pay: false };
    const body =
      stage === 'client' ? this.stgClient() :
      stage === 'time' ? this.stgTime() :
      stage === 'pay' ? this.stgPay() :
      stage === 'done' ? this.stgDone() :
      stage === 'linkFail' ? this.stgLinkFail() : null;
    const showBar = ['client','time','pay'].includes(stage);
    return H(React.Fragment, null,
      this.sheetHead('Новая запись'),
      showBar && this.renderMeridianPath(stage, done),
      H('div', { style:{ flex:1, overflow:'auto' } }, body),
      showBar && this.nbBottomBar(stage, done)
    );
  }

  renderMeridianPath(stage, done) {
    const steps = [ { k:'client', l:'Клиент' }, { k:'time', l:'Время' }, { k:'pay', l:'Оплата' } ];
    return H('div', { style:{ padding:'4px 26px 18px', display:'flex', alignItems:'center', gap:6 } },
      steps.flatMap((step, i) => {
        const active = stage === step.k;
        const isDone = done[step.k] && !active;
        const canJump = i === 0 || done[steps[i-1].k];
        const nodeBg = active || isDone ? 'var(--primary)' : 'var(--surf)';
        const nodeBorder = active || isDone ? 'var(--primary)' : 'var(--border)';
        const nodeInk = active || isDone ? '#fff' : 'var(--faint)';
        const labelC = active ? 'var(--primary)' : isDone ? 'var(--ink)' : 'var(--faint)';
        const out = [
          H('button', { key:step.k, className:'btn', disabled: !canJump && !active,
            onClick:()=>{ if (canJump) this.setState({ nbStage: step.k }); },
            style:{ display:'flex', alignItems:'center', gap:8, padding:'4px 6px', borderRadius:8, cursor: canJump ? 'pointer' : 'not-allowed' } },
            H('span', { style:{ width:22, height:22, borderRadius:'50%', background:nodeBg, color:nodeInk, border:'1.5px solid ' + nodeBorder, display:'inline-flex', alignItems:'center', justifyContent:'center', fontSize:11.5, fontWeight:700, transition:'background 180ms, border-color 180ms' } },
              isDone ? H('span', { style:{ display:'inline-flex' }, dangerouslySetInnerHTML:{ __html: SVG(I.check, {size:12}) } }) : (i+1)
            ),
            H('span', { style:{ fontSize:13, color:labelC, fontWeight: active ? 600 : 500, transition:'color 180ms' } }, step.l)
          )
        ];
        if (i < steps.length - 1) {
          const fillPath = done[step.k];
          out.push(H('span', { key:'l'+i, style:{ flex:1, height:1.5, background: fillPath ? 'var(--primary)' : 'var(--border)', borderRadius:1, margin:'0 2px', transition:'background 220ms' } }));
        }
        return out;
      })
    );
  }

  nbBottomBar(stage) {
    const s = this.state;
    let primary;
    if (stage === 'client') primary = { l:'Выбрать время', disabled: !s.nbClient, go:()=>this.setState({ nbStage:'time' }) };
    else if (stage === 'time') primary = { l:'Перейти к оплате', disabled: !(s.nbService && s.nbPrice > 0), go:()=>this.setState({ nbStage:'pay' }) };
    else if (stage === 'pay') primary = { l: s.nbSending ? 'Создаём…' : 'Создать запись и ссылку', disabled: s.nbSending, go:()=>this.submitBooking(true) };
    return H('div', { style:{ padding:'14px 26px', borderTop:'1px solid var(--divider)', display:'flex', gap:10, alignItems:'center' } },
      stage !== 'client'
        ? H('button', { className:'btn btn-secondary', onClick:()=>this.setState({ nbStage: stage === 'pay' ? 'time' : 'client' }) }, 'Назад')
        : H('div', { style:{ minWidth:0 } }),
      H('div', { style:{ flex:1 } }),
      stage === 'pay' && H('button', { className:'btn btn-ghost', onClick:()=>this.submitBooking(false), style:{ fontSize:13 } }, 'Создать без оплаты'),
      H('button', { className:'btn btn-primary', disabled: primary.disabled, onClick: primary.go },
        primary.l,
        stage === 'pay' && !s.nbSending && H('span', { className:'kbd', style:{ marginLeft:6, background:'rgba(255,255,255,.14)', color:'rgba(255,255,255,.85)', borderColor:'transparent' } }, '⌘⏎')
      )
    );
  }

  stgClient() {
    const s = this.state;
    if (s.nbAdding) return this.stgClientAdd();
    const q = (s._nbSearch || '').toLowerCase();
    const recent = CLIENTS.slice(0, 5);
    const results = q ? CLIENTS.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q)).slice(0, 7) : recent;
    return H('div', { style:{ padding:'6px 26px 26px' } },
      H('div', { style:{ fontSize:15, fontWeight:600, color:'var(--ink)', marginBottom:12, letterSpacing:'-0.01em' } }, 'Выберите клиента'),

      { l:'Открыть Клиентов',  hint:'Список клиентов',             go:()=>{ this.setState({ cmdOpen:false }); this.nav('clients'); }, ic:'users' },
      { l:'Открыть Оплаты',    hint:'Платежи и ссылки',            go:()=>{ this.setState({ cmdOpen:false }); this.nav('payments'); }, ic:'wallet' },
      { l:'Открыть Настройки', hint:'Профиль и интеграции',        go:()=>{ this.setState({ cmdOpen:false }); this.nav('settings'); }, ic:'cog' },
      { l:'Интеграции',        hint:'ЮKassa, Telegram, календари', go:()=>{ this.setState({ cmdOpen:false, settingsTab:'integrations' }); this.nav('settings'); }, ic:'link' },
      { l:'Публичная запись',  hint:'Страница для клиентов',       go:()=>{ this.setState({ cmdOpen:false, settingsTab:'public' }); this.nav('settings'); }, ic:'link' },
      { l:'Переключить тему',  hint:'Светлая / тёмная',            go:()=>{ this.setState({ cmdOpen:false }); this.toggleTheme(); }, ic:'moon' },
    ];
    const clients = CLIENTS.filter(c => q && (c.name.toLowerCase().includes(q) || c.phone.includes(q))).slice(0, 5).map(c => ({ l: c.name, hint: c.phone, go: () => { this.setState({ cmdOpen:false }); this.nav('client/' + c.id); }, ic:'users' }));
    const all = q ? [...commands.filter(c => c.l.toLowerCase().includes(q) || c.hint.toLowerCase().includes(q)), ...clients] : commands;

    return H('div', { className:'fade-in', onClick:()=>this.setState({ cmdOpen:false }),
      style:{ position:'fixed', inset:0, background:'rgba(15,23,42,.42)', zIndex:90, display:'flex', alignItems:'flex-start', justifyContent:'center', padding:'80px 20px 20px', backdropFilter:'blur(2px)' } },
      H('div', { className:'pop', onClick:(e)=>e.stopPropagation(),
        style:{ width: 580, maxWidth:'100%', background:'var(--surf)', border:'1px solid var(--border)', borderRadius:14, boxShadow:'var(--shadowLg)', overflow:'hidden' } },
        H('div', { style:{ padding:'12px 16px', borderBottom:'1px solid var(--divider)', display:'flex', alignItems:'center', gap:10 } },
          H('span', { style:{ color:'var(--dim)' }, dangerouslySetInnerHTML:{ __html: SVG(I.search, {size:17}) } }),
          H('input', { autoFocus:true, className:'', placeholder:'Найти клиента, запись или действие', value: s.cmdQuery, onChange:(e)=>this.setState({ cmdQuery: e.target.value }), style:{ flex:1, height:36, border:'none', outline:'none', fontSize:15, background:'transparent', color:'var(--ink)' } }),
          H('span', { className:'kbd' }, 'Esc')
        ),
        H('div', { style:{ maxHeight:'50vh', overflow:'auto', padding:6 } },
          all.length === 0
            ? H('div', { style:{ padding:'24px 12px', textAlign:'center', color:'var(--dim)', fontSize:13 } }, 'Ничего не найдено')
            : all.map((cmd, i) => H('button', { key:i, className:'btn', onClick: cmd.go,
                style:{ display:'flex', alignItems:'center', gap:12, width:'100%', textAlign:'left', padding:'10px 12px', borderRadius:8, fontSize:14 },
                'style-hover':{ background:'var(--hover)' } },
                H('span', { style:{ width:28, height:28, borderRadius:6, background:'var(--surf2)', color:'var(--muted)', display:'inline-flex', alignItems:'center', justifyContent:'center' }, dangerouslySetInnerHTML:{ __html: SVG(I[cmd.ic] || I.arrow, {size:14}) } }),
                H('div', { style:{ flex:1, minWidth:0 } },
                  H('div', { style:{ color:'var(--ink)', fontWeight:500 } }, cmd.l),
                  H('div', { style:{ fontSize:12, color:'var(--dim)', marginTop:1 } }, cmd.hint)
                )
              ))
        )
      )
    );
  }

  renderToasts() {
    const t = this.state.toasts;
    if (!t.length) return null;
    return H('div', { style:{ position:'fixed', bottom:24, right:24, display:'flex', flexDirection:'column', gap:8, zIndex:80 } },
      t.map(x => {
        const col = x.kind === 'success' ? 'var(--success)' : x.kind === 'warn' ? 'var(--warn)' : x.kind === 'error' ? 'var(--danger)' : 'var(--primary)';
        return H('div', { key:x.id, className:'toast-in',
          style:{ background:'var(--ink)', color:'var(--bg)', padding:'12px 16px', borderRadius:10, boxShadow:'var(--shadowLg)', fontSize:13.5, display:'flex', alignItems:'center', gap:10, minWidth:260, maxWidth:400 } },
          H('span', { style:{ color:col, display:'inline-flex' }, dangerouslySetInnerHTML:{ __html: SVG(I[x.icon] || I.check, {size:16}) } }),
          H('span', { style:{ flex:1 } }, x.msg));
      })
    );
  }
}
</script>
</body>
</html>
